# 24 everyday, non-coding web tasks: 3 per site x 8 sites.
# Date tokens like {date:first_friday_next_month} (optionally +N days) are resolved once per experiment
# into concrete dates (data/resolved_dates.json) so baseline and with_kb runs use identical dates.
# ground_truth is filled only where the answer is stable; otherwise the judge relies on trajectory + screenshots.

# ----------------------------------------------------------------------------- Travel: Google Flights
- id: flights_01
  site: google.com/travel/flights
  category: travel
  start_url: https://www.google.com/travel/flights
  instruction: >
    Find the cheapest nonstop round-trip economy flight for 1 adult from San Francisco (SFO) to Seattle (SEA),
    departing {date:first_friday_next_month} and returning {date:first_friday_next_month+2}.
    Report the airline and the round-trip price. Do not book.
  task_type: lookup
  success_criteria: >
    Final answer names an airline and a round-trip price, and the final page shows round-trip results
    from SFO to SEA for the requested departure and return dates, filtered to nonstop flights, with the
    reported flight being the cheapest nonstop option shown.
  ground_truth: null
  hard_patterns: [date_picker, filters, autocomplete]
  irreversible_stop_words: ["Book", "Continue to book", "Purchase", "Pay"]

- id: flights_02
  site: google.com/travel/flights
  category: travel
  start_url: https://www.google.com/travel/flights
  instruction: >
    Find the earliest-departing one-way flight for 1 adult from Oakland (OAK) to Los Angeles (LAX) on
    {date:next_tuesday}. Report its departure time and airline. Do not book.
  task_type: lookup
  success_criteria: >
    The search is one-way, OAK to LAX (not other Bay Area or LA-area airports), on the requested date, and the
    reported flight is the earliest departure among the results (sorted by or verified against departure time).
  ground_truth: null
  hard_patterns: [date_picker, autocomplete, trip_type_dropdown, sorting]
  irreversible_stop_words: ["Book", "Continue to book", "Purchase", "Pay"]

- id: flights_03
  site: google.com/travel/flights
  category: travel
  start_url: https://www.google.com/travel/flights
  instruction: >
    Search round-trip economy flights for 1 adult from San Francisco (SFO) to Seattle (SEA), departing
    {date:first_friday_next_month} and returning {date:first_friday_next_month+2}. Use the site's bags filter
    so that prices include 1 carry-on bag, then report the cheapest option's airline and price. Do not book.
  task_type: lookup
  success_criteria: >
    The final results page shows SFO to SEA round trip for the requested dates with the bags filter set to
    1 carry-on bag, and the answer reports the cheapest option's airline and price from that filtered list.
  ground_truth: null
  hard_patterns: [date_picker, filters, hidden_filter_menu]
  irreversible_stop_words: ["Book", "Continue to book", "Purchase", "Pay"]

